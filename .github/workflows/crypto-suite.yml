name: Isolated crypto suite

on:
  workflow_call:
    inputs:
      suite:
        required: true
        type: string
      reviewed_head_sha:
        required: true
        type: string

permissions:
  contents: read

env:
  REVIEWED_HEAD_SHA: ${{ inputs.reviewed_head_sha }}

jobs:
  crypto-suite:
    timeout-minutes: 120
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: wallet_mpc
          POSTGRES_USER: wallet_mpc
          POSTGRES_PASSWORD: ci-only-password
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U wallet_mpc -d wallet_mpc"
          --health-interval 5s --health-timeout 5s --health-retries 10
    runs-on: ubuntu-latest
    env:
      CRYPTO_SUITE: ${{ inputs.suite }}
      DATABASE_URL: postgresql://wallet_mpc:ci-only-password@127.0.0.1:5432/wallet_mpc
      POSTGRES_DB: wallet_mpc
      POSTGRES_USER: wallet_mpc
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: 127.0.0.1
      DJANGO_SECRET_KEY: ci-transport-only
      MPC_SIGNER_BACKEND: local_key
      CUSTODY_DEMO_MODE: "true"
      CUSTODY_TX_MODE: stub
      CUSTODY_INDEXER_MODE: stub
      LOCAL_KEY_ENCRYPTION_PASSPHRASE: ci-transport-only
      PHASE6F_TRON_JAR: /tmp/phase6f-FullNode.jar
      PYTHONPATH: backend-side:mpc-side/integration
      PHASE6FB_SOLANA_BIN: /tmp/phase6fb-solana/solana-release/bin
      PHASE6GC_PROFILE_COMPAT_BIN: work/profile-compat-target/debug
      PHASE6GC_CURRENT_CLAIM_COMPAT_BIN: work/current-claim-compat-target/debug
      PHASE6GC_SOLANA_PLATFORM_TOOLS: work/solana-platform-tools
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.REVIEWED_HEAD_SHA }}
          persist-credentials: false
      - name: Verify and report exact reviewed head
        run: |
          test "$(git rev-parse HEAD)" = "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: %s\n' "$REVIEWED_HEAD_SHA"
          printf 'Reviewed head SHA: `%s`\n' "$REVIEWED_HEAD_SHA" >> "$GITHUB_STEP_SUMMARY"
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: 1.90.0}
      - uses: Swatinem/rust-cache@v2
        with: {workspaces: mpc-side, shared-key: mpc-network}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend-side/requirements.txt
      - run: pip install -r backend-side/requirements.txt
      - if: inputs.suite == 'evm' || inputs.suite == 'tron' || inputs.suite == 'integrated'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mpc-side/integration/evm/package-lock.json
      - if: inputs.suite == 'evm' || inputs.suite == 'tron' || inputs.suite == 'integrated'
        run: npm ci --prefix mpc-side/integration/evm
      - if: inputs.suite == 'tron' || inputs.suite == 'integrated'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "8"
      - name: Cache public pinned java-tron release
        if: inputs.suite == 'tron' || inputs.suite == 'integrated'
        uses: actions/cache@v4
        with:
          path: /tmp/phase6f-FullNode.jar
          key: java-tron-4.8.2.3-faef7f4d89b9f154632bbab2db1712c25f02ee37b356013e098558ea994accec
      - name: Fetch and verify pinned disposable java-tron validator
        if: inputs.suite == 'tron' || inputs.suite == 'integrated'
        run: |
          if [ ! -f "$PHASE6F_TRON_JAR" ]; then
            curl --fail --location --silent --show-error https://github.com/tronprotocol/java-tron/releases/download/GreatVoyage-v4.8.2.3/FullNode.jar -o "$PHASE6F_TRON_JAR"
          fi
          echo "faef7f4d89b9f154632bbab2db1712c25f02ee37b356013e098558ea994accec  $PHASE6F_TRON_JAR" | sha256sum --check
      - name: Cache pinned disposable Solana validator
        if: inputs.suite == 'solana' || inputs.suite == 'integrated'
        uses: actions/cache@v4
        with:
          path: /tmp/phase6fb-solana/solana-release
          key: agave-2.1.21-linux-5da3359e296f1e6c13522b874317cb4cfe33e73301a9dc60b1e1435cc133b397
      - name: Fetch and verify pinned isolated Solana validator
        if: inputs.suite == 'solana' || inputs.suite == 'integrated'
        run: |
          mkdir -p /tmp/phase6fb-solana
          if [ ! -x "$PHASE6FB_SOLANA_BIN/solana-test-validator" ]; then
            curl --fail --location --silent --show-error https://github.com/anza-xyz/agave/releases/download/v2.1.21/solana-release-x86_64-unknown-linux-gnu.tar.bz2 -o /tmp/phase6fb-solana/release.tar.bz2
            echo "5da3359e296f1e6c13522b874317cb4cfe33e73301a9dc60b1e1435cc133b397  /tmp/phase6fb-solana/release.tar.bz2" | sha256sum --check
            tar -xjf /tmp/phase6fb-solana/release.tar.bz2 -C /tmp/phase6fb-solana
          fi
          "$PHASE6FB_SOLANA_BIN/solana-test-validator" --version
      - name: Cache pinned upstream SBF compiler archive
        if: inputs.suite == 'solana'
        uses: actions/cache@v4
        with:
          path: work/solana-platform-tools-archive
          key: solana-platform-v1.43-linux-x86_64-7a497174a0484bf8eee2d0a5a03a48f91ea0b5d1ba2d4055f37ef975a64ca8f6
      - name: Verify and extract compiler for isolated CPI acceptance fixture
        if: inputs.suite == 'solana'
        run: python mpc-side/integration/solana_local/fetch_platform_tools.py --cache work/solana-platform-tools-archive --output "$PHASE6GC_SOLANA_PLATFORM_TOOLS"
      - if: inputs.suite == 'ton' || inputs.suite == 'integrated'
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: mpc-side/integration/ton/package-lock.json
      - if: inputs.suite == 'ton' || inputs.suite == 'integrated'
        run: |
          npm ci --prefix mpc-side/integration/ton
          node mpc-side/integration/ton/compile.cjs
      - name: Provision pinned isolated TON validators from local genesis
        if: inputs.suite == 'ton' || inputs.suite == 'integrated'
        env:
          PYTHONPATH: backend-side:mpc-side/integration
        run: python -m ton.localnet work/ton-bootstrap --container phase6fc-localton
      - run: cargo build --locked --manifest-path mpc-side/Cargo.toml --bin wallet-mpc-coordinator --bin wallet-mpc-signer --bin wallet-mpc-witness --bin wallet-mpc-protected-signer --bin wallet-mpc-profile-migration --example frost_round1_fixture --example frost_signing_package --example cggmp_round1_fixture --example cggmp_aux_message_fixture --example seeded_message_check --example authority_client_probe
      - name: Check out the fixed original protected profile writer
        if: inputs.suite == 'solana'
        uses: actions/checkout@v4
        with:
          ref: 4a4e6ffca0d7107d53e742144f52838a3473f32e
          path: work/profile-compat-baseline
          persist-credentials: false
      - name: Build and identify genuine original None-profile services
        if: inputs.suite == 'solana'
        run: |
          CARGO_TARGET_DIR="$PWD/work/profile-compat-target" cargo build --locked --manifest-path work/profile-compat-baseline/mpc-side/Cargo.toml --bin wallet-mpc-coordinator --bin wallet-mpc-witness --bin wallet-mpc-protected-signer --example frost_signing_package
          python mpc-side/integration/profile_migration_baseline.py --source work/profile-compat-baseline --bin "$PHASE6GC_PROFILE_COMPAT_BIN"
      - name: Check out the fixed rules2 repaired-store writer
        if: inputs.suite == 'solana'
        uses: actions/checkout@v4
        with:
          ref: 7ff1e56340a000e9eeefb02ee6f199340062ee85
          path: work/current-claim-compat-baseline
          persist-credentials: false
      - name: Build and identify genuine historical repaired-store services
        if: inputs.suite == 'solana'
        run: |
          CARGO_TARGET_DIR="$PWD/work/current-claim-compat-target" cargo build --locked --manifest-path work/current-claim-compat-baseline/mpc-side/Cargo.toml --bin wallet-mpc-coordinator --bin wallet-mpc-witness --bin wallet-mpc-protected-signer --example frost_signing_package
          python mpc-side/integration/current_claim_baseline.py --source work/current-claim-compat-baseline --bin "$PHASE6GC_CURRENT_CLAIM_COMPAT_BIN"
      - name: Check out the fixed pre-migration development baseline
        if: inputs.suite == 'network'
        uses: actions/checkout@v4
        with:
          ref: 3d32b763ff777347f77eae7a8a7936d85dc2d770
          path: work/backend-compat-baseline
          persist-credentials: false
      - name: Build the unchanged legacy services with the original lockfile
        if: inputs.suite == 'network'
        run: |
          test "$(git -C work/backend-compat-baseline rev-parse HEAD)" = "3d32b763ff777347f77eae7a8a7936d85dc2d770"
          CARGO_TARGET_DIR="$PWD/work/backend-compat-target" cargo build --locked --manifest-path work/backend-compat-baseline/mpc-side/Cargo.toml --bin wallet-mpc-coordinator --bin wallet-mpc-signer
      - name: Verify original encrypted stores and receipts across backend migration
        if: inputs.suite == 'network'
        run: |
          python mpc-side/integration/backend_compatibility.py --legacy-bin work/backend-compat-target/debug --candidate-bin mpc-side/target/debug --work-dir work/backend-compat-private --public-report work/backend-compat-public.json
      - name: Run every selected original scenario with private fixtures local to this job
        run: |
          mkdir -p work/crypto
          pytest -x -v -s mpc-side/integration/test_cggmp.py mpc-side/integration/test_cggmp_aux.py mpc-side/integration/test_network.py mpc-side/integration/test_dkg.py mpc-side/integration/test_signing.py mpc-side/integration/test_solana.py mpc-side/integration/test_ton.py mpc-side/integration/test_ton_network.py mpc-side/integration/test_ton_django.py mpc-side/integration/test_integrated.py --crypto-suite="$CRYPTO_SUITE" --crypto-manifest=work/crypto/manifest.json --basetemp=work/crypto/fixtures --junitxml=work/crypto/results.xml --durations=0
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: crypto-${{ inputs.suite }}-public-results
          retention-days: 7
          path: |
            work/crypto/manifest.json
            work/backend-compat-public.json
            work/integrated-review/public-evidence.json
            work/crypto/results.xml
            work/crypto/fixtures/**/tron-evidence.json
            work/crypto/fixtures/**/tron-child-evidence.json
            work/crypto/fixtures/**/evm-child-evidence.json
            work/crypto/fixtures/**/child-issuance-benchmark.json
            work/crypto/fixtures/**/child-issuance-initial-stage.json
            work/crypto/fixtures/**/solana-evidence.json
            work/crypto/fixtures/**/solana-seeded-primitive-evidence.json
            work/crypto/fixtures/**/solana-registry-public-evidence.json
            work/crypto/fixtures/**/solana-native-issuance-public-evidence.json
            work/crypto/fixtures/**/solana-replacement-witness-public-evidence.json
            work/crypto/fixtures/**/solana-repair-public-evidence.json
            work/crypto/fixtures/**/solana-repair-fence-public-evidence.json
            work/crypto/fixtures/**/solana-profile-migration-public-evidence.json
            work/crypto/fixtures/**/solana-profile-terminal-fence-public-evidence.json
            work/crypto/fixtures/**/solana-profile-successor-import-public-evidence.json
            work/crypto/fixtures/**/solana-profile-migrated-runtime-public-evidence.json
            work/crypto/fixtures/**/solana-refresh-reservation-public-evidence.json
            work/crypto/fixtures/**/solana-refresh-historical-ids-public-evidence.json
            work/crypto/fixtures/**/solana-custody-read-query-public-evidence.json
            work/crypto/fixtures/**/solana-financial-mode-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-last_r2-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-before_record-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-first_r2-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-round1-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-client_disconnect-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-coordinator_restart-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-write_failure-public-evidence.json
            work/crypto/fixtures/**/solana-protected-coordinator-invalid_share-public-evidence.json
            work/crypto/fixtures/**/solana-financial-root-import-public-evidence.json
            work/crypto/fixtures/**/solana-financial-wallet-public-evidence.json
            work/crypto/fixtures/**/solana-financial-session-allocation-public-evidence.json
            work/crypto/fixtures/**/solana-financial-preparation-public-evidence.json
            work/crypto/fixtures/**/solana-financial-signature-public-evidence.json
            work/crypto/fixtures/**/solana-financial-signature-before_record-public-evidence.json
            work/crypto/fixtures/**/solana-financial-signature-audit_and_cache_loss-public-evidence.json
            work/crypto/fixtures/**/solana-financial-finality-success-public-evidence.json
            work/crypto/fixtures/**/solana-financial-finality-lost_ack-public-evidence.json
            work/crypto/fixtures/**/solana-financial-finality-settlement_audit-public-evidence.json
            work/crypto/fixtures/**/solana-native-financial-legacy-public-evidence.json
            work/crypto/fixtures/**/solana-native-financial-v0-public-evidence.json
            work/crypto/fixtures/**/solana-native-financial-pda-public-evidence.json
            work/crypto/fixtures/**/solana-seeded-token-sweep-public-evidence.json
            work/crypto/fixtures/**/solana-token-financial-public-evidence.json
            work/crypto/fixtures/**/solana-current-claim-authority-public-evidence.json
            work/crypto/fixtures/**/solana-current-claim-public-evidence.json
            work/crypto/fixtures/**/solana-current-claim-faults-public-evidence.json
            work/crypto/fixtures/**/solana-current-claim-upgrade-public-evidence.json
            work/crypto/fixtures/**/solana-current-claim-financial-public-evidence.json
            work/crypto/fixtures/**/solana-receipt-pin-cohorts-public-evidence.json
            work/crypto/fixtures/**/solana-rotation-inventory-public-evidence.json
            work/crypto/fixtures/**/solana-coordinator-routing-public-evidence.json
            work/crypto/fixtures/**/solana-routed-financial-public-evidence.json
            work/crypto/fixtures/**/solana-financial-signature-route_config_loss-public-evidence.json
            work/crypto/fixtures/**/solana-repaired-current-claim-public-evidence.json
            work/ton-review/mpc-tvm-evidence.json
            work/ton-review/validator-network-evidence.json
            work/ton-review/django-validator-evidence.json
            work/crypto/fixtures/**/public-genesis/zerostate.boc
            work/crypto/fixtures/**/public-genesis/basestate0.boc
            work/crypto/fixtures/**/public-genesis/localton-settings.json
            work/crypto/fixtures/**/public-genesis/global.config.json

